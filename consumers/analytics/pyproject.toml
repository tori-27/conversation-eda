[project]
name = "analytics"
version = "0.1.0"
description = "Analytics consumer for conversation events"
authors = [
    { name = "Dmytro Poslavskyi", email = "dmytro.poslavskyi@student.tuke.sk" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
analytics = "analytics.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
